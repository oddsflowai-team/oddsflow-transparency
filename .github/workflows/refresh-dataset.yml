name: Refresh settled-predictions dataset

# Weekly auto-refresh of the settled-predictions dataset from OddsFlow's public
# read-only export endpoint. Fully autonomous — runs in GitHub's infra, commits
# with the built-in GITHUB_TOKEN, then the existing HF sync workflow mirrors it.
on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC (13:00 MYT)
  workflow_dispatch: {}    # manual trigger button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest settled export
        run: python3 .github/scripts/refresh_dataset.py
        env:
          EXPORT_URL: https://www.oddsflow.ai/api/v1/settled-export
      - name: Commit if changed
        run: |
          git config user.name "oddsflow-bot"
          git config user.email "support@oddsflow.ai"
          if [ -n "$(git status --porcelain datasets/settled-predictions)" ]; then
            git add datasets/settled-predictions
            git commit -m "chore: weekly settled-predictions refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No dataset changes this week."
          fi
